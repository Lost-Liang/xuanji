<svg viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
  <title>璇玑</title>

  <!-- 外轮廓 — 微微呼吸 -->
  <ellipse cx="11" cy="11" rx="9" ry="9" fill="none" stroke="#22D3EE" stroke-width="0.8" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate"
      from="0 11 11" to="360 11 11" dur="40s" repeatCount="indefinite"/>
    <animate attributeName="ry"
      values="9; 8.7; 8.5; 8.7; 9; 8.6; 8.3; 8.6; 9"
      keyTimes="0; 0.125; 0.25; 0.375; 0.5; 0.625; 0.75; 0.875; 1"
      dur="10s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1"/>
  </ellipse>

  <!-- 赤道环 — 正弦波动的三维旋转 -->
  <ellipse cx="11" cy="11" rx="9" ry="0" fill="none" stroke="#7C3AED" stroke-width="0.8" opacity="0.85">
    <animateTransform attributeName="transform" type="rotate"
      from="0 11 11" to="360 11 11" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="ry"
      values="0; 2.3; 4.5; 6.4; 7.8; 8.7; 9; 8.7; 7.8; 6.4; 4.5; 2.3; 0; 0; 0; 0; 0; 2.3; 4.5; 6.4; 7.8; 8.7; 9; 8.7; 7.8; 6.4; 4.5; 2.3; 0"
      keyTimes="0; 0.035; 0.07; 0.105; 0.14; 0.175; 0.21; 0.245; 0.28; 0.315; 0.35; 0.385; 0.42; 0.46; 0.5; 0.54; 0.58; 0.615; 0.65; 0.685; 0.72; 0.755; 0.79; 0.825; 0.86; 0.895; 0.93; 0.965; 1"
      dur="6s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1"/>
  </ellipse>

  <!-- 子午环 — 相位偏移的正弦波动 -->
  <ellipse cx="11" cy="11" rx="9" ry="9" fill="none" stroke="#22D3EE" stroke-width="0.8" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate"
      from="90 11 11" to="450 11 11" dur="25s" repeatCount="indefinite"/>
    <animate attributeName="ry"
      values="9; 8.7; 7.8; 6.4; 4.5; 2.3; 0; 0; 0; 0; 0; 2.3; 4.5; 6.4; 7.8; 8.7; 9; 8.7; 7.8; 6.4; 4.5; 2.3; 0; 0; 0; 0; 0; 2.3; 4.5; 6.4; 7.8; 8.7; 9"
      keyTimes="0; 0.035; 0.07; 0.105; 0.14; 0.175; 0.21; 0.25; 0.29; 0.33; 0.37; 0.405; 0.44; 0.475; 0.51; 0.545; 0.58; 0.615; 0.65; 0.685; 0.72; 0.755; 0.79; 0.825; 0.86; 0.895; 0.93; 0.965; 1"
      dur="7s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1"/>
  </ellipse>

  <!-- 斜环 — 独立节奏 -->
  <ellipse cx="11" cy="11" rx="9" ry="4" fill="none" stroke="#7C3AED" stroke-width="0.8" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate"
      from="45 11 11" to="405 11 11" dur="35s" repeatCount="indefinite"/>
    <animate attributeName="ry"
      values="4; 5.5; 6.8; 7.9; 8.7; 9; 8.7; 7.9; 6.8; 5.5; 4; 2.5; 1.2; 0; 1.2; 2.5; 4"
      keyTimes="0; 0.0625; 0.125; 0.1875; 0.25; 0.3125; 0.375; 0.4375; 0.5; 0.5625; 0.625; 0.6875; 0.75; 0.8125; 0.875; 0.9375; 1"
      dur="8s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1; 0.5 0 0.5 1"/>
  </ellipse>

  <!-- 中心点 -->
  <circle cx="11" cy="11" r="1" fill="#22D3EE">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.5 0 0.5 1; 0.5 0 0.5 1"/>
  </circle>

</svg>