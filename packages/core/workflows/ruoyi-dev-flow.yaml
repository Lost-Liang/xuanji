# 若依研发流程 (TDD)
#
# 流程：write_tests → develop → test → code_review ↔ code_fix → final_review
#
# TDD 思想：
# 1. 先写测试（Red）：根据 acceptance_criteria 生成测试代码
# 2. 再写代码（Green）：实现功能让测试通过
# 3. 重构优化：代码审查确保质量
#
# 循环设计：
# - test → develop：功能测试失败，回到开发重做（最多 2 次）
# - code_review ↔ code_fix：代码质量问题修复循环（最多 3 次）
#
# Task 7 迁移（流程驱动流程控制）：
# - budget：调度层监督的预算上限（agent 调用数 / 墙钟 / 单节点访问次数）
# - inputs：节点 prompt 的数据来源。develop 声明 [task, test]，
#           回环重入时自动携带「测试为什么失败」。
# - 条件边 source：function 条件函数读取哪个节点的产出（Task 3 hard fail 校验）

version: "1"
id: ruoyi-dev-flow
name: 若依研发流程
description: TDD流程：先写测试 → 开发实现 → 测试验证 → 代码审查 → 最终审查

budget:
  max_agent_invocations: 40
  max_wall_clock_minutes: 120
  max_node_visits: 5

nodes:
  # 1. 写测试（TDD Red 阶段）
  - id: write_tests
    type: agent
    name: 写测试
    agent_binding_ids: [test-engineer]
    inputs: [task]
    write_key: results

  # 2. 开发（TDD Green 阶段）
  - id: develop
    type: agent
    name: 开发
    agent_binding_ids: [ruoyi-developer]
    inputs: [task, test]   # 回环重入时携带测试失败报告（首次进入时 test 尚未产出，自动跳过）
    write_key: results

  # 3. 测试验证
  - id: test
    type: agent
    name: 测试验证
    agent_binding_ids: [tester]
    inputs: [task, develop]
    write_key: results

  # 4. 代码审查
  - id: code_review
    type: agent
    name: 代码审查
    agent_binding_ids: [reviewer]
    inputs: [task, develop, test]
    write_key: results

  # 5. 代码修复（审查发现问题时进入）
  - id: code_fix
    type: agent
    name: 代码修复
    agent_binding_ids: [code-fixer]
    inputs: [task, code_review]
    write_key: results

  # 6. 最终审查（人审 gate）
  - id: final_review
    type: gate
    name: 最终审查

edges:
  # write_tests → develop（先写测试，再写代码）
  - from: write_tests
    to: develop

  # develop → test（开发完成后测试验证）
  - from: develop
    to: test

  # test 条件边：pass → code_review, fail → develop（最多 2 次）
  - from: test
    to: code_review
    condition:
      type: function
      config:
        name: test_pass
        source: test

  - from: test
    to: develop
    condition:
      type: function
      config:
        name: test_fail
        source: test
    loop_max: 2

  # code_review 条件边：pass → final_review, issues → code_fix（最多 3 次）
  - from: code_review
    to: final_review
    condition:
      type: function
      config:
        name: code_review_pass
        source: code_review

  - from: code_review
    to: code_fix
    condition:
      type: function
      config:
        name: code_review_issues
        source: code_review
    loop_max: 3

  # code_fix → code_review（修复后重新审查）
  - from: code_fix
    to: code_review

  # final_review → __end__（人审通过后流程结束）
  - from: final_review
    to: __end__

start:
  - write_tests
